{{ define "main" }}
<div class="page-heading"><a class="back-link" href="{{ site.Home.RelPermalink }}">← {{ i18n "knowledgeBase" }}</a><h1>{{ .Title }}</h1><p class="lead text-body-secondary">{{ .Description }}</p>{{ .Content }}</div>
<div class="article-list mb-5">{{ range .Pages.ByDate.Reverse }}{{ partial "entry.html" . }}{{ else }}<p>{{ i18n "emptySection" }}</p>{{ end }}</div>
{{ end }}
