<article class="article-entry">
  <div><span class="eyebrow">{{ with .CurrentSection }}{{ .Title }}{{ end }}</span><h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3><p>{{ .Description }}</p></div>
  <span class="entry-meta">{{ if not .Date.IsZero }}{{ .Date | time.Format ":date_medium" }}{{ end }} <span aria-hidden="true">↗</span></span>
</article>
